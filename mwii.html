<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Wonderland</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Roboto', sans-serif; color: #fff; overflow-x: hidden; }
        
        body {
            background: linear-gradient(to bottom, #0a1f3d, #1e3c72);
            background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?fm=jpg&q=60&w=3000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 1.8em; }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }

        nav a:hover { color: #a0d8ef; }

        .menu-toggle {
            display: none;
            font-size: 1.8em;
            cursor: pointer;
        }

        /* Snowflakes */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .snowflake {
            position: absolute;
            color: #fff;
            font-size: 1.5em;
            opacity: 0.9;
            animation: fall linear infinite, sway ease-in-out infinite;
            text-shadow: 0 0 8px #fff;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(100px); }
        }

        /* Sections */
        section {
            min-height: 100vh;
            padding: 120px 10% 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        h2 { font-size: 3em; }

        p { font-size: 1.4em; line-height: 1.8; margin-bottom: 20px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .gallery img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s;
        }

        .gallery img:hover { transform: scale(1.05); }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            width: 100%;
        }

        input, textarea {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1em;
        }

        input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.7); }

        button {
            padding: 15px;
            background: #a0d8ef;
            color: #0a1f3d;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { background: #fff; }

        /* Mobile */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            nav ul {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgba(0, 0, 0, 0.9);
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: 50px;
                transition: left 0.4s;
            }

            nav ul.active { left: 0; }

            h1 { font-size: 3em; }
            h2 { font-size: 2.5em; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Winter Wonderland</div>
        <div class="menu-toggle" onclick="document.querySelector('nav ul').classList.toggle('active')">☰</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#cozy">Cozy Moments</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="snowflakes" aria-hidden="true">
        <!-- Many snowflakes for dense effect -->
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <div class="snowflake">❅</div><div class="snowflake">❆</div><div class="snowflake">❄</div>
        <!-- Add more if you want even denser snow -->
    </div>

    <section id="home">
        <div class="glass">
            <h1>Welcome to Winter Wonderland</h1>
            <p>Experience the serene beauty of snow-covered landscapes under a starry sky. Let the magic of winter envelop you.</p>
        </div>
    </section>

    <section id="gallery">
        <h2>Winter Gallery</h2>
        <div class="gallery">
            <img src="https://freerangestock.com/sample/184859/starry-night-sky-over-snow-covered-mountain-landscape.jpg" alt="Starry snowy mountains">
            <img src="https://i1.wp.com/foreverlostintravel.com/wp-content/uploads/2020/11/cabin-in-the-woods-winter.jpg?fit=688%2C458&ssl=1" alt="Cozy winter cabin">
            <img src="https://images.stockcake.com/public/6/e/9/6e9a0960-d203-432c-b276-c09c96396df5_large/snowy-forest-path-stockcake.jpg" alt="Snowy forest path">
            <img src="https://media.istockphoto.com/id/163729324/photo/aurora-borealis.jpg?s=612x612
