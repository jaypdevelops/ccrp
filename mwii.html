<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Wonderland</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f1b3a, #1e3c72); /* Night sky gradient fallback */
        }

        body {
            background: url('https://images.pexels.com/photos/1552212/pexels-photo-1552212.jpeg?cs=srgb&dl=pexels-souvenirpixels-1552212.jpg&fm=jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
        }

        .content {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 4em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.5em;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        /* Snowfall effect */
        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10%;
            color: #fff;
            font-size: 1.5em;
            opacity: 0.8;
            animation: fall linear infinite, sway ease-in-out infinite;
            text-shadow: 0 0 5px #fff;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(110vh); }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(80px); }
        }

        /* Multiple snowflakes with variations */
        .snowflake:nth-child(1) { left: 10%; animation-duration: 15s, 8s; animation-delay: 0s, 0s; font-size: 1.2em; }
        .snowflake:nth-child(2) { left: 20%; animation-duration: 20s, 10s; animation-delay: 2s, 1s; font-size: 1.8em; }
        .snowflake:nth-child(3) { left: 30%; animation-duration: 18s, 12s; animation-delay: 4s, 2s; font-size: 1em; }
        .snowflake:nth-child(4) { left: 40%; animation-duration: 22s, 9s; animation-delay: 6s, 3s; font-size: 2em; }
        .snowflake:nth-child(5) { left: 50%; animation-duration: 17s, 11s; animation-delay: 1s, 4s; font-size: 1.5em; }
        .snowflake:nth-child(6) { left: 60%; animation-duration: 25s, 13s; animation-delay: 8s, 5s; font-size: 1.3em; }
        .snowflake:nth-child(7) { left: 70%; animation-duration: 16s, 7s; animation-delay: 3s, 6s; font-size: 2.2em; }
        .snowflake:nth-child(8) { left: 80%; animation-duration: 19s, 14s; animation-delay: 5s, 7s; font-size: 1.1em; }
        .snowflake:nth-child(9) { left: 90%; animation-duration: 21s, 10s; animation-delay: 7s, 8s; font-size: 1.7em; }
        .snowflake:nth-child(10) { left: 15%; animation-duration: 23s, 12s; animation-delay: 9s, 9s; font-size: 1.4em; }
    </style>
</head>
<body>
    <div class="snowflakes">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
    </div>

    <div class="container">
        <div class="content">
            <h1>Welcome to Winter Wonderland</h1>
            <p>Embrace the magic of snow-covered landscapes and peaceful winter nights.<br>Let the snowflakes dance around you!</p>
        </div>
    </div>
</body>
</html>
